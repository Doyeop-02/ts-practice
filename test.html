<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배포 테스트 페이지</title>
    <style>
        /* 간단한 스타일을 추가해서 CSS 작동도 확인합니다. */
        body {
            font-family: sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚀 배포 성공! 🚀</h1>
        <p>GitHub Pages를 통한 정적 웹사이트 배포 테스트입니다.</p>
        <p>이 페이지가 보인다면, 성공적으로 배포된 것입니다.</p>
    </div>

</body>
</html>
